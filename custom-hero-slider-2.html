
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luxury Jewellery Slider</title>

  <!-- Bootstrap 5 -->

        rel="stylesheet"> -->

  <style>
    :root {
      --dur: 1.1s;
      --ease: cubic-bezier(.65, 0, .25, 1);
    }

    * {
      box-sizing: border-box;
    }



    .hero {
      height: 100vh;
      min-height: 600px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: #17110e;
    }

    /* Right colour panel */
    .panel {
      position: absolute;
      inset: 0 0 0 58%;
      background: #8a5a2b;
      transition: background var(--dur) var(--ease);
    }

    /* Left animated background */
    .bgs {
      position: absolute;
      inset: 0 42% 0 0;
      overflow: hidden;
    }

    .sl {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transform: translateY(100%);
      transition: transform var(--dur) var(--ease);
      will-change: transform;
    }

    .sl.cur {
      transform: translateY(0);
    }

    .sl.below {
      transform: translateY(100%);
    }

    .sl.above {
      transform: translateY(-100%);
    }

.img {
  position: absolute;
  inset: 0;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  transform: scale(1.18);
  transition: transform 1.4s var(--ease);
}

.img::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(10, 10, 10, 0.48);
}

    .sl.below .img {
      transform: translateY(-14%) scale(1.18);
    }

    .sl.above .img {
      transform: translateY(14%) scale(1.18);
    }

    /* Decorative lines */
    .line {
      position: absolute;
      left: 20.7%;
      top: 0;
      height: 30%;
      width: 1px;
      background: rgba(255, 255, 255, .4);
    }

    .line.b {
      top: auto;
      bottom: 0;
    }

    /* Animated copy */
    .copy {
      position: absolute;
      z-index: 1;
      left: 20.7%;
      top: 50%;
      transform: translateY(-50%);
      width: min(58%, 420px);
      transition: transform 1.3s var(--ease);
    }

    .sl.below .copy {
      transform: translateY(calc(-50% + 60px));
    }

    .sl.above .copy {
      transform: translateY(calc(-50% - 60px));
    }

    .copy > * {
      transition: transform 1.3s var(--ease);
    }

    .sl.below .copy > * {
      transform: translateY(18px);
    }

    .sl.above .copy > * {
      transform: translateY(-18px);
    }

    .copy h1 {
      font-size: clamp(23px, 2.6vw, 36px);
      line-height: 1.2;
      margin-bottom: 14px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .copy h2 {
      font-size: clamp(17px, 1.9vw, 25px);
      line-height: 1.3;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .copy p {
      font-size: 13px;
      line-height: 1.8;
      margin-bottom: 22px;
      color: #eee;
    }

    .cta {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 2px;
      background: #14392a;
      color: white;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .3s;
    }

    .cta:hover {
      background: #20543e;
    }

    /* Jewellery carousel viewport */
    
/* Jewellery carousel viewport */
.viewport {
  position: absolute;
  left: 54%;
  right: 0;
  top: 50%;
  height: min(52vh, 340px);
  transform: translateY(-50%);
  z-index: 2;
  overflow: hidden;
  width: auto;
}

/* Track */
.track {
  display: flex;
  width: 100%;
  height: 100%;
  gap: 16px;
  overflow: visible;
}


/* Show 1.2 cards */
/* .card {
  position: relative;
  flex:0 0 calc((100% - 3.2px) / 1.8);
  min-width: 0;
  height: 100%;
  overflow: hidden;
  border-radius: 12px;
  background: var(--g);
  box-shadow: 0 14px 40px rgba(0, 0, 0, .35);
} */

.card {
  position: relative;
  flex: 0 0 calc((100% - 16px) / 1.8);
  min-width: 0;
  height: 100%;
  overflow: hidden;
  border-radius: 12px;
  background: var(--g);
  box-shadow: 0 14px 40px rgba(0, 0, 0, .35);

  /* Animate individual cards */
  transform: translateX(0);
  transition: transform 1.1s cubic-bezier(.65, 0, .25, 1);
}

    /* Card artwork */
    .card-art {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--g);
    }

    .card-art::before {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 50%;
      transform: rotate(-25deg);
    }

    .gem {
      width: 110px;
      height: 140px;
      position: relative;
      filter: drop-shadow(0 12px 15px rgba(0, 0, 0, .35));
    }

    .gem::before {
      content: "";
      position: absolute;
      inset: 10px 12px;
      background: linear-gradient(
        135deg,
        #fff2c6,
        #d8b06a 35%,
        #8c6033 65%,
        #f4d89b
      );
      clip-path: polygon(
        50% 0, 100% 28%, 80% 100%,
        20% 100%, 0 28%
      );
      border: 1px solid rgba(255, 255, 255, .4);
    }

    .gem::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 20%;
      width: 2px;
      height: 70%;
      background: rgba(255, 255, 255, .6);
      transform: rotate(25deg);
    }

    .card-label {
      position: absolute;
      z-index: 1;
      bottom: 18px;
      left: 18px;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    /* Directional colour wipe */
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: var(--wipe, #7fc4b9);
      transform: translateX(-101%);
      opacity: .65;
      pointer-events: none;
    }

    .card.wipe-next::after {
      animation: wipeNext var(--dur) var(--ease) forwards;
    }

    .card.wipe-prev::after {
      animation: wipePrev var(--dur) var(--ease) forwards;
    }

    @keyframes wipeNext {
      0%   { transform: translateX(-101%); }
      50%  { transform: translateX(0); }
      100% { transform: translateX(101%); }
    }

    @keyframes wipePrev {
      0%   { transform: translateX(101%); }
      50%  { transform: translateX(0); }
      100% { transform: translateX(-101%); }
    }

    /* Navigation buttons */
    .nav {
      position: absolute;
      left: 56%;
      bottom: 7%;
      display: flex;
      gap: 12px;
      z-index: 4;
    }

    .nav button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .35);
      color: white;
      font-size: 19px;
      cursor: pointer;
      transition: background .3s, transform .2s;
    }

    .nav button:hover {
      background: white;
      color: #111;
    }

    .nav button:active {
      transform: scale(.92);
    }

    .nav button:disabled {
      opacity: .45;
      cursor: default;
    }

    /* Responsive layout */
    @media (max-width: 700px) {
      .hero {
        min-height: 650px;
        height: 100svh;
      }

      .panel {
        inset: 0;
        opacity: .65;
      }

      .bgs {
        inset: 0;
      }

      .copy {
        left: 9%;
        top: 10%;
        transform: none;
        width: 82%;
      }

      .sl.below .copy {
        transform: translateY(30px);
      }

      .sl.above .copy {
        transform: translateY(-30px);
      }

      .copy h1 {
        font-size: clamp(24px, 7vw, 34px);
      }

      .copy h2 {
        font-size: 18px;
      }

      .copy p {
        font-size: 12px;
        max-width: 400px;
      }

      .cta {
        max-width: 300px;
      }

      .viewport {
        left: 8%;
        right: 0;
        top: auto;
        bottom: 15%;
        height: 30%;
        transform: none;
      }

      .track {
        gap: 6%;
      }

      .card {
        flex-basis: 60vw;
      }

      .gem {
        transform: scale(.8);
      }

      .nav {
        left: 8%;
        bottom: 5%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sl, .img, .copy, .copy > *,
      .track, .panel {
        transition-duration: .01ms !important;
      }

      .card.wipe-next::after,
      .card.wipe-prev::after {
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

<section class="hero">

  <div class="panel" id="panel"></div>
  <div class="bgs" id="bgs"></div>

  <div class="viewport">
    <div class="track" id="track"></div>
  </div>

  <div class="nav">
    <button id="prev" type="button" aria-label="Previous slide">
      &larr;
    </button>
    <button id="next" type="button" aria-label="Next slide">
      &rarr;
    </button>
  </div>

</section>

<script>
  const slides = [
    {
      color: "#8a5a2b",
      title: "The Gemstone Edit",
      sub: "Where Every Stone Tells a Story",
      desc: "Discover extraordinary gemstones transformed into jewellery designed to be treasured for generations.",
      cta: "Discover Gemstones",
      bg: "linear-gradient(135deg, #3a2a1a, #6b4a2a)",
      bgImg: "assets/images/hore/Rectangle1.jpg",
      card: "linear-gradient(160deg, #1a1230, #6b5a3a)",
      label: "The Gemstone Collection"
    },
    {
      color: "#5a0a28",
      title: "Timeless. Distinctive. Yours.",
      sub: "Designed to Be Remembered",
      desc: "Contemporary jewellery crafted with exceptional gemstones and an enduring sense of elegance.",
      cta: "Shop New Arrivals",
      bg: "linear-gradient(135deg, #2a1020, #5a1a30)",
      bgImg: "assets/images/hore/Rectangle2.jpg",
      card: "linear-gradient(160deg, #a8957a, #c9a85a)",
      label: "Timeless Elegance"
    },
    {
      color: "#777b9a",
      title: "Crafted in Jaipur",
      sub: "Heritage, Reimagined",
      desc: "The artistry of Jaipur meets contemporary design in jewellery created for today's celebrations.",
      cta: "Discover the Collection",
      bg: "linear-gradient(135deg, #333344, #777b9a)",
      bgImg: "assets/images/hore/Rectangle3.jpg",
      card: "linear-gradient(160deg, #d8b070, #b88a4a)",
      label: "Jaipur Heritage"
    }
  ];

  const $ = id => document.getElementById(id);

  const track = $("track");
  const bgs = $("bgs");
  const panel = $("panel");
  const hero = document.querySelector(".hero");

  let index = 0;
  let busy = false;
  let unlockTimer;

  // Create cards and background slides
  slides.forEach((s, position) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.setProperty("--g", s.card);

    card.innerHTML = `
      <div class="card-art">
        <div class="gem"></div>
      </div>
      <div class="card-label">${s.label}</div>
    `;

    track.appendChild(card);

    const layer = document.createElement("div");
    layer.className = "sl below";

  //   layer.innerHTML = `
  //      <div class="img"
  //      style="background-image: url('${s.bgImg}'); background-color: ${slideColorFallback(s)};">
  // </div>
  //     <div class="line"></div>
  //     <div class="line b"></div>

  //     <div class="copy">
  //       <h1>${s.title}</h1>
  //       <h2>${s.sub}</h2>
  //       <p>${s.desc}</p>
  //       <button class="cta" type="button">${s.cta}</button>
  //     </div>
  //   `;

  layer.innerHTML = `
  <div class="img"
       style="background-image: url('${s.bgImg}');">
  </div>

  <div class="line"></div>
  <div class="line b"></div>

  <div class="copy">
    <h1>${s.title}</h1>
    <h2>${s.sub}</h2>
    <p>${s.desc}</p>
    <button class="cta" type="button">${s.cta}</button>
  </div>
`;

    bgs.appendChild(layer);
  });

  const cards = [...track.children];
  const layers = [...bgs.children];

  // Position the active card
  // function place() {
  //   const card = cards[index];
  //   if (!card) return;

  //   const viewport = document.querySelector(".viewport");
  //   const maxScroll = Math.max(0, track.scrollWidth - viewport.clientWidth);
  //   const x = Math.min(card.offsetLeft, maxScroll);

  //   track.style.transform = `translateX(${-x}px)`;
  // }

//   function place() {
//   const card = cards[index];
//   if (!card) return;

//   const viewport = document.querySelector(".viewport");
//   const maxScroll = Math.max(
//     0,
//     track.scrollWidth - viewport.clientWidth
//   );

//   const x = Math.min(card.offsetLeft, maxScroll);

//   track.style.transform = `translateX(${-x}px)`;
// }

function place(direction = 0) {
  const viewport = document.querySelector(".viewport");
  const cardWidth = cards[0].getBoundingClientRect().width;
  const gap = parseFloat(getComputedStyle(track).gap) || 0;

  const distance = cardWidth + gap;

  cards.forEach((card, i) => {
    card.style.transform = `translateX(${-index * distance}px)`;
  });
}

  function go(direction, first = false) {
    if (busy && !first) return;

    const nextIndex = first
      ? 0
      : Math.max(0, Math.min(index + direction, slides.length - 1));

    if (!first && nextIndex === index) return;

    busy = true;
    clearTimeout(unlockTimer);

    const oldLayer = layers[index];
    index = nextIndex;

    const slide = slides[index];
    const incoming = layers[index];

    panel.style.background = slide.color;

    if (first) {
      incoming.className = "sl cur";
    } else {
      oldLayer.className = "sl " + (direction > 0 ? "above" : "below");

      // Set the incoming slide's starting position
      incoming.style.transition = "none";
      incoming.className = "sl " + (direction > 0 ? "below" : "above");

      const image = incoming.querySelector(".img");
      const copy = incoming.querySelector(".copy");

      image.style.transition = "none";
      copy.style.transition = "none";

      copy.querySelectorAll("*").forEach(el => {
        el.style.transition = "none";
      });

      void incoming.offsetWidth;

      incoming.style.transition = "";
      image.style.transition = "";
      copy.style.transition = "";

      copy.querySelectorAll("*").forEach(el => {
        el.style.transition = "";
      });

      // Animate incoming background and text
      incoming.className = "sl cur";

      // Directional card colour wipe
      cards.forEach(card => {
        card.classList.remove("wipe-next", "wipe-prev");
      });

      cards[index].style.setProperty("--wipe", slide.color);
      void cards[index].offsetWidth;

      cards[index].classList.add(
        direction > 0 ? "wipe-next" : "wipe-prev"
      );
    }

    place();

    $("prev").disabled = index === 0;
    $("next").disabled = index === slides.length - 1;

    if (first) {
      busy = false;
    } else {
      unlockTimer = setTimeout(() => {
        busy = false;
      }, 1150);
    }
  }

  $("next").addEventListener("click", () => go(1));
  $("prev").addEventListener("click", () => go(-1));

  // Keyboard navigation
  window.addEventListener("keydown", event => {
    if (event.key === "ArrowRight") go(1);
    if (event.key === "ArrowLeft") go(-1);
  });

  // Touch and pointer swipe
  let startX = null;
  let startY = null;

  hero.addEventListener("pointerdown", event => {
    startX = event.clientX;
    startY = event.clientY;
  });

  hero.addEventListener("pointerup", event => {
    if (startX === null || startY === null) return;

    const dx = event.clientX - startX;
    const dy = event.clientY - startY;

    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      go(dx < 0 ? 1 : -1);
    }

    startX = null;
    startY = null;
  });

  hero.addEventListener("pointercancel", () => {
    startX = null;
    startY = null;
  });

  window.addEventListener("resize", place);

  // Start on the first slide
  go(0, true);
</script>
