
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luxury Jewellery Hero Slider</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ease: cubic-bezier(.65, 0, .25, 1);
      --dur: 1.1s;
      box-sizing: border-box;
    }

    * {
      box-sizing: inherit;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: #000;
      font-family: Montserrat, system-ui, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .hero {
      position: relative;
      height: 100%;
      min-height: 420px;
      overflow: hidden;
      isolation: isolate;
    }

    /* Right-side colour panel */
    .panel {
      position: absolute;
      inset: 0 0 0 58%;
      background: #8a5a2b;
      transition: background var(--dur) var(--ease);
    }

    

    /* Left-side background slides */
    .bgs {
      position: absolute;
      inset: 0 42% 0 0;
      overflow: hidden;
    }

    .sl {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transition: transform var(--dur) var(--ease);
      will-change: transform;
    }

    .sl.below {
      transform: translateY(100%);
    }

    .sl.above {
      transform: translateY(-100%);
    }

    .sl.cur {
      transform: translateY(0);
    }

    /* Background image */
    .img {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      transform: scale(1.18);
      transition: transform 1.4s var(--ease);
    }

    .img::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 10, .45);
    }

    .sl.below .img {
      transform: translateY(-14%) scale(1.18);
    }

    .sl.above .img {
      transform: translateY(14%) scale(1.18);
    }

    /* Decorative vertical lines */
    .line {
      position: absolute;
      left: 20.7%;
      top: 0;
      height: 30%;
      width: 1px;
      background: rgba(255, 255, 255, .4);
    }

    .line.b {
      top: auto;
      bottom: 0;
    }

    /* Copy container moves up/down with the slide */
    .copy {
      position: absolute;
      z-index: 1;
      left: 20.7%;
      top: 50%;
      margin-top: -90px;
      width: min(58%, 420px);
      transition: transform 1.3s var(--ease);
      will-change: transform;
    }

    .sl.below .copy {
      transform: translateY(60px);
    }

    .sl.above .copy {
      transform: translateY(-60px);
    }

    .copy > * {
      transition: transform 1.3s var(--ease);
    }

    .sl.below .copy > * {
      transform: translateY(18px);
    }

    .sl.above .copy > * {
      transform: translateY(-18px);
    }

    .copy > *:nth-child(3) {
      transition-duration: 1.4s;
    }

    .copy > *:nth-child(4) {
      transition-duration: 1.5s;
    }

    h1 {
      font-size: clamp(22px, 2.6vw, 36px);
      line-height: 1.2;
      margin: 0 0 14px;
      text-transform: uppercase;
      letter-spacing: .02em;
    }

    h2 {
      font-size: clamp(18px, 1.9vw, 26px);
      line-height: 1.3;
      margin: 0 0 14px;
      font-weight: 600;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 22px;
      opacity: .9;
    }

    .cta {
      display: block;
      width: 100%;
      padding: 14px;
      background: #14392a;
      color: #fff;
      text-align: center;
      border: 0;
      border-radius: 3px;
      font: 700 12px Montserrat, system-ui, sans-serif;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .cta:hover {
      background: #20543e;
    }

    /* Jewellery cards */
   .viewport {
  position: absolute;
  left: 54%;
  right: 0;
  top: 50%;
  height: min(52vh, 340px);
  transform: translateY(-50%);
  z-index: 2;
  overflow: hidden;
}

/* Horizontal carousel track */
.track {
  display: flex;
  gap: 6%;
  width: 100%;
  height: 100%;
  transition: transform var(--dur) var(--ease);
  will-change: transform;
}
/* Jewellery cards */
.card {
  position: relative;
  flex: 0 0 min(30vw, 389px);
  height: 100%;
  overflow: hidden;
  border-radius: 12px;
  background: var(--g);
  box-shadow: 0 14px 40px rgba(0, 0, 0, .35);
}

/* Responsive mobile carousel */
@media (max-width: 700px) {
  .viewport {
    left: 8%;
    right: 0;
    top: auto;
    bottom: 12%;
    height: 30%;
    transform: none;
  }

  .track {
    gap: 6%;
  }

  .card {
    flex-basis: 60vw;
  }
}

    /* Card artwork */
    .card-art {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--g);
    }

    .gem {
      width: 110px;
      height: 140px;
      position: relative;
      filter: drop-shadow(0 12px 15px rgba(0, 0, 0, .35));
    }

    .gem::before {
      content: "";
      position: absolute;
      inset: 10px 12px;
      background: linear-gradient(
        135deg,
        #fff2c6,
        #d8b06a 35%,
        #8c6033 65%,
        #f4d89b
      );
      clip-path: polygon(
        50% 0,
        100% 28%,
        80% 100%,
        20% 100%,
        0 28%
      );
      border: 1px solid rgba(255, 255, 255, .4);
    }

    .gem::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 20%;
      width: 2px;
      height: 70%;
      background: rgba(255, 255, 255, .6);
      transform: rotate(25deg);
    }

    /* Directional colour wipe */
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: var(--wipe, #7fc4b9);
      transform: translateX(-101%);
      opacity: .65;
      pointer-events: none;
    }

    .card.wipe-next::after {
      animation: wipeNext var(--dur) var(--ease) forwards;
    }

    .card.wipe-prev::after {
      animation: wipePrev var(--dur) var(--ease) forwards;
    }

    @keyframes wipeNext {
      0% {
        transform: translateX(-101%);
      }
      50% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(101%);
      }
    }

    @keyframes wipePrev {
      0% {
        transform: translateX(101%);
      }
      50% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-101%);
      }
    }

    /* Navigation */
    .nav {
      position: absolute;
      left: 56%;
      bottom: 7%;
      display: flex;
      gap: 12px;
      z-index: 4;
    }

    .nav button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 0;
      background: rgba(255, 255, 255, .35);
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      transition: background .3s, transform .2s;
    }

    .nav button:hover {
      background: rgba(255, 255, 255, .7);
      color: #111;
    }

    .nav button:active {
      transform: scale(.92);
    }

    
  </style>
</head>

<body>
  <section class="hero">
    <div class="panel" id="panel"></div>
    <div class="bgs" id="bgs"></div>

    <div class="viewport">
      <div class="track" id="track"></div>
    </div>

    <div class="nav">
      <button id="prev" type="button" aria-label="Previous slide">&larr;</button>
      <button id="next" type="button" aria-label="Next slide">&rarr;</button>
    </div>
  </section>

  <script>
    // Change these values to use your own image URLs.
    const slides = [
      {
        color: "#8a5a2b",
        title: "The Gemstone Edit",
        sub: "Where Every Stone Tells a Story",
        desc: "Discover extraordinary gemstones transformed into jewellery designed to be treasured for generations.",
        cta: "Discover Gemstones",
        bg: "linear-gradient(135deg, #3a2a1a, #6b4a2a)",
        card: "linear-gradient(160deg, #1a1230, #6b5a3a)"
      },
      {
        color: "#5a0a28",
        title: "Timeless. Distinctive. Yours.",
        sub: "Designed to Be Remembered",
        desc: "Contemporary jewellery crafted with exceptional gemstones and an enduring sense of elegance.",
        cta: "Shop New Arrivals",
        bg: "linear-gradient(135deg, #2a1020, #5a1a30)",
        card: "linear-gradient(160deg, #a8957a, #c9a85a)"
      },
      {
        color: "#9a9db8",
        title: "Crafted in Jaipur",
        sub: "Heritage, Reimagined",
        desc: "The artistry of Jaipur meets contemporary design in jewellery created for today's celebrations.",
        cta: "Discover the Collection",
        bg: "linear-gradient(135deg, #555, #888)",
        card: "linear-gradient(160deg, #d8b070, #b88a4a)"
      }
    ];

    const $ = id => document.getElementById(id);

    const track = $("track");
    const bgs = $("bgs");
    const panel = $("panel");
    const hero = document.querySelector(".hero");

    let i = 0;
    let busy = false;
    let unlockTimer;

    // Create each card and background slide.
    slides.forEach(s => {
      const c = document.createElement("div");
      c.className = "card";
      c.style.setProperty("--g", s.card);

      c.innerHTML = `
        <div class="card-art">
          <div class="gem"></div>
        </div>
      `;

      track.appendChild(c);

      const l = document.createElement("div");
      l.className = "sl below";

      // Background, decorative lines, and copy are in each slide.
      l.innerHTML = `
        <div class="img" style="background:${s.bg}"></div>
        <div class="line"></div>
        <div class="line b"></div>

        <div class="copy">
          <h1>${s.title}</h1>
          <h2>${s.sub}</h2>
          <p>${s.desc}</p>
          <button class="cta" type="button">${s.cta}</button>
        </div>
      `;

      bgs.appendChild(l);
    });

    const cards = [...track.children];
    const layers = [...bgs.children];

    // Centre the active card.
    
function place() {
  if (!cards[i]) return;

  // Align the active card to the left of the viewport.
  // This prevents the slider from wrapping at the last card.
  const x = -cards[i].offsetLeft;

  track.style.transform = `translateX(${x}px)`;
}


    // dir = 1 for next; dir = -1 for previous.
    function go(dir, first = false) {
  if (busy && !first) return;

  const nextIndex = first
    ? 0
    : Math.max(0, Math.min(i + dir, slides.length - 1));

  // Stop when already at the first or last card.
  if (!first && nextIndex === i) return;

  busy = true;
  clearTimeout(unlockTimer);

  const old = layers[i];
  const previousIndex = i;

  i = nextIndex;

  const slide = slides[i];
  const incoming = layers[i];

  panel.style.background = slide.color;

  if (first) {
    incoming.className = "sl cur";
  } else {
    // Animate the old background away.
    old.className = "sl " + (dir > 0 ? "above" : "below");

    // Position the incoming background before animation.
    incoming.style.transition = "none";
    incoming.className = "sl " + (dir > 0 ? "below" : "above");

    const incomingImage = incoming.querySelector(".img");
    const incomingCopy = incoming.querySelector(".copy");

    incomingImage.style.transition = "none";
    incomingCopy.style.transition = "none";

    incomingCopy.querySelectorAll("*").forEach(el => {
      el.style.transition = "none";
    });

    void incoming.offsetWidth;

    incoming.style.transition = "";
    incomingImage.style.transition = "";
    incomingCopy.style.transition = "";

    incomingCopy.querySelectorAll("*").forEach(el => {
      el.style.transition = "";
    });

    // Animate the incoming background.
    incoming.className = "sl cur";

    // Directional card colour wipe.
    cards.forEach(card => {
      card.classList.remove("wipe-next", "wipe-prev");
    });

    cards[i].style.setProperty("--wipe", slide.color);

    void cards[i].offsetWidth;

    cards[i].classList.add(
      dir > 0 ? "wipe-next" : "wipe-prev"
    );
  }

  // Move to the selected card without looping back to the beginning.
  place();

  // Disable navigation while the animation runs.
  unlockTimer = setTimeout(() => {
    busy = false;
  }, 1150);
}

    // Button navigation.
    $("next").addEventListener("click", () => go(1));
    $("prev").addEventListener("click", () => go(-1));

    // Keyboard navigation.
    addEventListener("keydown", event => {
      if (event.key === "ArrowRight") go(1);
      if (event.key === "ArrowLeft") go(-1);
    });

    // Swipe navigation.
    let sx = null;
    let sy = null;

    hero.addEventListener("pointerdown", event => {
      sx = event.clientX;
      sy = event.clientY;
    });

    hero.addEventListener("pointerup", event => {
      if (sx === null || sy === null) return;

      const dx = event.clientX - sx;
      const dy = event.clientY - sy;

      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        go(dx < 0 ? 1 : -1);
      }

      sx = null;
      sy = null;
    });

    hero.addEventListener("pointercancel", () => {
      sx = null;
      sy = null;
    });

    addEventListener("resize", place);

    // Start on the first slide. Autoplay is disabled.
    go(0, true);
  </script>
</body>
</html>
